name: Render Rania Calonnya Cicilan v1 (chunked)

on:
  workflow_dispatch:

jobs:
  render-chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { start: 0, end: 393 }
          - { start: 394, end: 787 }
          - { start: 788, end: 1181 }
          - { start: 1182, end: 1575 }
          - { start: 1576, end: 1969 }
          - { start: 1970, end: 2363 }
          - { start: 2364, end: 2757 }
          - { start: 2758, end: 3146 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          google-chrome --version
      - name: Install dependencies
        run: npm install
      - name: Reassemble audio mix
        run: |
          mkdir -p public/rania
          cat audio-parts/mix.mp3.b64.part-* | base64 -d > public/rania/mix.mp3
          ls -la public/rania/mix.mp3
      - name: Render chunk ${{ matrix.start }}-${{ matrix.end }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
          VIDEO: 02_rania_cicilan
        run: node scripts/render-chunk-rania.mjs ${{ matrix.start }} ${{ matrix.end }}
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.start }}-${{ matrix.end }}
          path: out/rania/chunks/chunk-${{ matrix.start }}-${{ matrix.end }}.mp4
          retention-days: 7

  concat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [render-chunk]
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
      - name: Reassemble audio mix
        run: |
          mkdir -p public/rania
          cat audio-parts/mix.mp3.b64.part-* | base64 -d > public/rania/mix.mp3
          ls -la public/rania/mix.mp3
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks
          merge-multiple: true
      - name: Concat + mux audio
        run: |
          ls -la chunks/
          printf "file 'chunks/chunk-0-393.mp4'\nfile 'chunks/chunk-394-787.mp4'\nfile 'chunks/chunk-788-1181.mp4'\nfile 'chunks/chunk-1182-1575.mp4'\nfile 'chunks/chunk-1576-1969.mp4'\nfile 'chunks/chunk-1970-2363.mp4'\nfile 'chunks/chunk-2364-2757.mp4'\nfile 'chunks/chunk-2758-3146.mp4'\n" > concat.txt
          cat concat.txt
          ffmpeg -y -f concat -safe 0 -i concat.txt -c copy video_nocaps.mp4
          ffmpeg -y -i video_nocaps.mp4 -i public/rania/mix.mp3 -c:v copy -c:a aac -b:a 192k -shortest Rania_Video_Final.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 Rania_Video_Final.mp4
          ls -la *.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: Rania_Final
          path: Rania_Video_Final.mp4
          retention-days: 30
